<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
body{
    margin:0;
    height:100vh;
    font-family:'Comic Sans MS', cursive;
    overflow:hidden;

    /* Pink background with hearts pattern */
    background-color:#ffb6d5;
    background-image:
    radial-gradient(white 2px, transparent 2px),
    radial-gradient(white 2px, transparent 2px);
    background-position: 0 0, 25px 25px;
    background-size:50px 50px;

    display:flex;
    justify-content:center;
    align-items:center;
}

/* white card */
.container{
    background:white;
    padding:45px;
    border-radius:25px;
    box-shadow:0 0 35px rgba(255,0,120,0.35);
    text-align:center;
    width:320px;
}

h1{
    color:#ff2e75;
    margin-bottom:10px;
}

p{
    color:#d63384;
    font-size:18px;
}

.buttons{
    margin-top:30px;
    position:relative;
    height:80px;
}

button{
    padding:12px 26px;
    border:none;
    border-radius:25px;
    font-size:18px;
    cursor:pointer;
    transition:0.25s;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

/* YES button */
#yes{
    background:#ff4d88;
    color:white;
}
#yes:hover{
    transform:scale(1.12);
    background:#ff2e75;
}

/* NO button */
#no{
    background:#ffe6f0;
    color:#444;
    position:absolute;
    left:60%;
}

/* second page */
#rosePage{
    display:none;
    position:absolute;
    text-align:center;
}

.rose{
    font-size:110px;
    animation:float 2s infinite ease-in-out;
}

@keyframes float{
    0%{transform:translateY(0);}
    50%{transform:translateY(-18px);}
    100%{transform:translateY(0);}
}

/* sparkles */
.sparkle{
    position:absolute;
    width:8px;
    height:8px;
    background:white;
    border-radius:50%;
    animation:spark 1s linear forwards;
}

@keyframes spark{
    from{
        opacity:1;
        transform:scale(1) translateY(0);
    }
    to{
        opacity:0;
        transform:scale(2) translateY(-80px);
    }
}
</style>

</head>

<body>

<!-- first page -->

<div class="container" id="questionPage">
    <h1>Hey You ❤️</h1>
    <p>Would you like to take a gift?</p>

```
<div class="buttons">
    <button id="yes" onclick="showRose()">Yes 💝</button>
    <button id="no">No 🙈</button>
</div>
```

</div>

<!-- second page -->

<div id="rosePage">
    <div class="rose">🌹</div>
    <h1>Happy Rose Day My Love ❤️</h1>
    <p>
        I just wanna see if you smiled after this.<br>
        I miss you.<br>
        Happy Rose Day 🌹
    </p>
</div>

<script>
/* running NO button */
const noBtn = document.getElementById("no");
noBtn.addEventListener("mouseover", ()=>{
    const x = Math.random()*300 - 150;
    const y = Math.random()*200 - 100;
    noBtn.style.transform = `translate(${x}px, ${y}px)`;
});

/* show rose + sparkles */
function showRose(){
    document.getElementById("questionPage").style.display="none";
    const page = document.getElementById("rosePage");
    page.style.display="block";

    // create sparkles
    for(let i=0;i<120;i++){
        let s = document.createElement("div");
        s.className="sparkle";
        s.style.left=Math.random()*window.innerWidth+"px";
        s.style.top=Math.random()*window.innerHeight+"px";
        s.style.animationDelay=Math.random()+"s";
        document.body.appendChild(s);

        setTimeout(()=>{s.remove();},1000);
    }
}
</script>

</body>
</html>
