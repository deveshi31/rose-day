<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
body{
    margin:0;
    font-family: 'Comic Sans MS', cursive;
    background: linear-gradient(135deg,#ffd6e8,#ffe6f2,#fff0f5);
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.container{
    background:white;
    padding:40px;
    border-radius:25px;
    box-shadow:0 0 25px rgba(255,0,100,0.3);
}

h1{
    color:#ff2e75;
}

p{
    font-size:20px;
    color:#d63384;
}

.buttons{
    margin-top:25px;
    position:relative;
    height:80px;
}

button{
    padding:12px 28px;
    border:none;
    border-radius:20px;
    font-size:18px;
    cursor:pointer;
    transition:0.2s;
}

#yes{
    background:#ff4d88;
    color:white;
}

#yes:hover{
    transform:scale(1.1);
}

#no{
    background:#f1f1f1;
    color:#444;
    position:absolute;
    left:60%;
    top:0;
}

.rose-page{
    display:none;
    flex-direction:column;
    align-items:center;
}

.rose{
    font-size:90px;
    animation: float 2s infinite ease-in-out;
}

@keyframes float{
    0%{transform:translateY(0px);}
    50%{transform:translateY(-20px);}
    100%{transform:translateY(0px);}
}

img{
    width:220px;
    margin-bottom:15px;
}
</style>

</head>

<body>

<div class="container" id="questionPage">
    <img src="https://i.imgur.com/6R8YyZP.png">
    <h1>Hi My Love ❤️</h1>
    <p>Would you like to take a gift?</p>

```
<div class="buttons">
    <button id="yes" onclick="showRose()">Yes</button>
    <button id="no">No</button>
</div>
```

</div>

<div class="rose-page" id="rosePage">
    <div class="rose">🌹</div>
    <h1>Happy Rose Day My Love ❤️</h1>
    <p>For Avi — from the person who loves you the most.</p>
</div>

<script>
const noBtn = document.getElementById("no");

noBtn.addEventListener("mouseover", function(){
    const x = Math.random()*250 - 120;
    const y = Math.random()*150 - 80;
    noBtn.style.transform = `translate(${x}px, ${y}px)`;
});

function showRose(){
    document.getElementById("questionPage").style.display="none";
    document.getElementById("rosePage").style.display="flex";
}
</script>

</body>
</html>
